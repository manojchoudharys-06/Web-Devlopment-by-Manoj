<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Periodic Table</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:25px;
    font-family:Arial, sans-serif;
    background:#fff;
}

.table{
    width:1200px;
    margin:auto;
}

.title{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin-bottom:5px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(18,1fr);
    gap:2px;
}

.element{
    height:64px;
    border:1px solid #777;
    text-align:center;
    position:relative;
    padding-top:15px;
}

.num{
    position:absolute;
    top:2px;
    left:3px;
    font-size:9px;
}

.symbol{
    font-size:18px;
    font-weight:bold;
}

.name{
    font-size:7px;
    margin-top:2px;
}

.electron{
    font-size:7px;
    margin-top:2px;
}

/* Colours */
.s{
    background:#cfeef2;
}

.p{
    background:#f4e8a8;
}

.d{
    background:#f4c99c;
}

.noble{
    background:#f4b4c0;
}

.f{
    background:#d9b9e8;
}

.meta{
    background:#cfe4c3;
}

/* Empty boxes */
.empty{
    border:0;
}

/* Headings */
.group{
    text-align:center;
    font-size:10px;
    font-weight:bold;
    margin-bottom:3px;
}

.labels{
    display:grid;
    grid-template-columns:repeat(18,1fr);
    margin-bottom:3px;
}

.series{
    margin-top:25px;
}

.series-title{
    text-align:center;
    font-size:12px;
    font-weight:bold;
    margin-bottom:6px;
}

.fgrid{
    display:grid;
    grid-template-columns:repeat(15,1fr);
    gap:2px;
    width:83.3%;
    margin-left:16.7%;
}

.fgrid .element{
    height:52px;
}

.fgrid .symbol{
    font-size:14px;
}

.fgrid .name{
    font-size:6px;
}

.period-label{
    position:absolute;
    left:-20px;
    font-size:10px;
    font-weight:bold;
}

/* Make it scrollable on small screen */
.wrapper{
    overflow-x:auto;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="table">

<div class="title">
    PERIODIC TABLE OF ELEMENTS
</div>

<!-- GROUP NUMBERS -->
<div class="labels">
    <div class="group">1</div>
    <div class="group">2</div>
    <div class="group">3</div>
    <div class="group">4</div>
    <div class="group">5</div>
    <div class="group">6</div>
    <div class="group">7</div>
    <div class="group">8</div>
    <div class="group">9</div>
    <div class="group">10</div>
    <div class="group">11</div>
    <div class="group">12</div>
    <div class="group">13</div>
    <div class="group">14</div>
    <div class="group">15</div>
    <div class="group">16</div>
    <div class="group">17</div>
    <div class="group">18</div>
</div>

<div class="grid" id="periodicTable"></div>

<!-- F BLOCK -->
<div class="series">

    <div class="series-title">
        f – Inner transition elements
    </div>

    <div class="fgrid" id="lanthanides"></div>

    <br>

    <div class="fgrid" id="actinides"></div>

</div>

</div>
</div>


<script>

const elements = [

/* 2 */

["O","Oxygen",8,"p",2,16],

["Ne","Neon",10,"noble",2,18],

/* 3 */

/* 4 */

/* 7 */

["Hs","Hassium",108,"d",7,8],

["Lv","Livermorium",116,"p",7,16],
["Ts","Tennessine",117,"p",7,17],
["Og","Oganesson",118,"noble",7,18]
];


/* Create main table */

const table = document.getElementById("periodicTable");

elements.forEach(e => {

    const box = document.createElement("div");

    box.className = "element " + e[3];

    box.style.gridColumn = e[5];
    box.style.gridRow = e[4];

    box.innerHTML = `
        <span class="num">${e[2]}</span>
        <div class="symbol">${e[0]}</div>
        <div class="name">${e[1]}</div>
    `;

    table.appendChild(box);
});


/* Lanthanides */

const lanthanides = [
["Ce","Cerium",58],
["Pr","Praseodymium",59],
["Nd","Neodymium",60],
["Pm","Promethium",61],
["Sm","Samarium",62],

["Lu","Lutetium",71]
];

const lanth = document.getElementById("lanthanides");

lanthanides.forEach(e => {

    lanth.innerHTML += `
        <div class="element f">
            <span class="num">${e[2]}</span>
            <div class="symbol">${e[0]}</div>
            <div class="name">${e[1]}</div>
        </div>
    `;

});


/* Actinides */

const actinides = [
["Th","Thorium",90],
["Pa","Protactinium",91],
["U","Uranium",92],
["Np","Neptunium",93],
["Pu","Plutonium",94],
["Am","Americium",95],

const act = document.getElementById("actinides");

actinides.forEach(e => {

    act.innerHTML += `
        <div class="element f">
            <span class="num">${e[2]}</span>
            <div class="symbol">${e[0]}</div>
            <div class="name">${e[1]}</div>
        </div>
    `;

});

</script>

</body>
</html>
