<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,
        tr,
        th,
        td,
        tfoot {
            border: 2px solid black;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
    <div>
        <h1>Tables</h1>
        <table>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>

            </tr>
        </table>
        <h1>studect score</h1>
        <table>
            <thead>
                <tr>
                    <th>studect/suject</th>
                    <th>maths</th>
                    <th>hindi</th>
                    <th>english</th>
                    <th>sccience</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>anu</td>
                    <td>90</td>
                    <td>95</td>
                    <td>75</td>
                    <td>80</td>
                <tr>
                    <td>ayushi</td>
                    <td>90</td>
                    <td>92</td>
                    <td>71</td>
                    <td>85</td>
                <tr>
                    <td>royan</td>
                    <td>40</td>
                    <td>70</td>
                    <td>60</td>
                    <td>50</td>
                <tr>
                    <td>ayam</td>
                    <td>55</td>
                    <td>65</td>
                    <td>75</td>
                    <td>85</td>
            </tbody>
            <tfoot>
                <th>total</th>
                <th></th>
                <th></th>
                <th></th>
                <th></th>
            </tfoot>
            <caption>student marks</caption>
        </table>
        <h2>rowspan & colspan</h2>
        <table>
            <tr>
                <th rowspan="2"></th>
                <th colspan="2" style="text-align: center:center">average </th>
                <th rowspan="2">red eyes</th>
            </tr>
            <tr>
                <td>height</td>
                <td>weight</td>
            </tr>
            <tr>
                <td>males</td>
                <td>1.9</td>
                <td>0.003</td>
                <td>40%</td>
            </tr>
            <tr>
                <td>female</td>
                <td>1.7</td>
                <td>0.002</td>
                <td>43%</td>
            </tr>
            <caption>a test table with merge cells</caption>
        </table>
    </div>
</body>

</html>
