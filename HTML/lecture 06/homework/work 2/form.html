<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <h1>Pete's Pizza Delivery {Un-arranged}</h1>
        <h2>Online Order Form</h2>
        <p><b>*</b>required fields</p>
        <!-- simple form -->
        <form action="">
            <fieldset>
                <legend>Customer details</legend>
                <label for="name"><b>*</b>Name:</label>
                <input type="text" id="name">
                <br> <br>
                <label for="add"><b>*</b>Address:</label>
                <input type="text" id="add">
                <br> <br>
                <label for="city"><b>*</b>Town/city:</label>
                <input type="text" id="city">
                <br> <br>
                <label for="post"><b>*</b>Postcode:</label>
                <input type="number" id="post">
                <br> <br>
                <label for="tel"><b>*</b>Tel:</label>
                <input type="text" id="tel">
                <br> <br>
                <label for="email"><b>*</b>Email:</label>
                <input type="email" id="emial">
            </fieldset>

            <fieldset>
                <legend>Topping<b>*</b></legend>
                <input type="radio" id="marg" name="radio">
                <label for="marg">Margherita</label>
                <br>
                <input type="radio" id="four" name="radio">
                <label for="four">Four Seasons</label>
                <br>
                <input type="radio" id="meat" name="radio">
                <label for="meat">Meat Feast</label>
            </fieldset>

            <fieldset>
                <legend>Size<b>*</b></legend>
                <input type="radio" id="small" name="radio">
                <label for="small">Small</label>
                <br>
                <input type="radio" id="medium" name="radio">
                <label for="medium">Medium</label>
                <br>
                <input type="radio" id="large" name="radio">
                <label for="large">Large</label>
            </fieldset>

            <fieldset>
                <legend>Extras</legend>
                <input type="checkbox" id="mush" name="mush">
                <label for="mush">Mushrooms</label>
                <br>
                <input type="checkbox" id="green" name="green">
                <label for="green">Green peppers</label>
                <br>
                <input type="checkbox" id="an" name="an">
                <label for="an">Anchovies</label>
                <br>
                <input type="checkbox" id="extra" name="extra">
                <label for="extra">Extra cheese</label>
            </fieldset>

            <fieldset>
                <legend>Delivery</legend>
                <label for="time">Preferred delivery time:</label>
                <input type="time" id="time" name="time">
                <br>
                <label for="deli">Delivery instructions:</label>
                <br>
                <textarea name="deli" rows="4" cols="190"></textarea>
            </fieldset>

            <button>Submit order</button>

        </form>

    </div>

    <br> <br>
