<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>.
</head>

<body>
    <div>
        <h1>Novel Services Login {Un-arranged}</h1>
        <br>
        <!-- simple form -->
        <form action="">
            <label for="username">Uername:</label>
            <input type="text" id="username">

            <br><br>
            <label for="password">Passsword:</label>
            <input type="password" id="password">

            <br> <br>
            <label for="city"> City of Employment:</label>
            <input type="text" id="city" name="city">

            <br> <br>
            <label for="server"> Web server:</label>
            <select type="server" id="server">
                <option value="">choose a server</option>
                <option value="">server1</option>
                <option value="">server2</option>
                <option value="">server3</option>
            </select>

            <br> <br>
            <label>Please specify your role:</label>
            <input type="radio" id="admin" name="role" value="admin">
            <label for="admin">Admin</label>
            <br>
            <input type="radio" id="engineer">
            <label for="engineer">Engineer</label>
            <br>
            <input type="radio" id="manager">
            <label for="manger">Manager</label>
            <br>
            <input type="radio" id="guest">
            <label for="guest"> Guest </label>

            <br> <br>
            <label for="sign"> Single sign-on to the following:</label>
            <input type="checkbox" id="mail">
            <label for="mail">Mail</label>
            <br>
            <input type="checkbox" id="payroll">
            <label for="payroll">Payroll</label>
            <br>
            <input type="checkbox" id="self">
            <label for="self">self-service</label>

            <br> <br>
            <button type="submit"> Login</button>
            <button type="submit"> Reset</button>

        </form>
    </div>

    <div>
        <h1>Novel Services Login {Well-arranged}</h1>
        <br>
        <!-- using table -->
        <form action="">
            <table>
                <tr>
                    <td><label for="username">Uername:</label>
                    </td>
                    <td><input type="text" id="username">
                    </td>
                </tr>

                <tr>
                    <td><label for="password">Passsword:</label>
                    </td>
                    <td><input type="password" id="password">
                    </td>
                </tr>

                <tr>
                    <td><label for="city"> City of Employment:</label>
                    </td>
                    <td><input type="text" id="city" name="city">
                    </td>
                </tr>

                <tr>
                    <td><label for="server"> Web server:</label>
                    </td>
                    <td><select type="server" id="server">
                            <option value="">choose a server</option>
                            <option value="">server1</option>
                            <option value="">server2</option>
                            <option value="">server3</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label>Please specify your role:</label>
                    </td>
                    <td><input type="radio" id="admin" name="role" value="admin">
                        <label for="admin">Admin</label>
                        <br>
                        <input type="radio" id="engineer">
                        <label for="engineer">Engineer</label>
                        <br>
                        <input type="radio" id="manager">
                        <label for="manger">Manager</label>
                        <br>
                        <input type="radio" id="guest">
                        <label for="guest"> Guest </label>
                    </td>
                </tr>

                <tr>
                    <td><label for="sign"> Single sign-on to the following:</label>
                    </td>
                    <td><input type="checkbox" id="mail">
                        <label for="mail">Mail</label>
                        <br>
                        <input type="checkbox" id="payroll">
                        <label for="payroll">Payroll</label>
                        <br>
                        <input type="checkbox" id="self">
                        <label for="self">self-service</label>
                    </td>
                </tr>

                <th colspan="1">
                <td><button type="submit"> Login</button>
                    <button type="submit"> Reset</button>
                </td>
                </th>

            </table>

        </form>

    </div>

</body>

</html>
